[project]
name = "kroma-worker"
version = "0.1.0"
description = "Kroma AI image processing worker"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.128.0",
    "pillow>=12.1.0",
    "python-multipart>=0.0.21",
    "uvicorn[standard]>=0.40.0",
    "rembg[cpu]>=2.0.0",
    "llvmlite>=0.43.0",
    "numba>=0.59.0",
    "opencv-contrib-python-headless>=4.9.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.13",
]
