[project]
name = "kroma-worker"
version = "0.1.0"
description = "Kroma AI image processing worker"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.128.0",
    "pillow>=12.1.0",
    "python-multipart>=0.0.21",
    "uvicorn[standard]>=0.40.0",
    "rembg[cpu]>=2.0.0",
    "opencv-contrib-python-headless>=4.9.0",
    "boto3>=1.43.104",
    "python-dotenv>=1.2.1",
    "aio-pika>=10.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.13",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
