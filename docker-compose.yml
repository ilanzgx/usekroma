services:
  web:
    container_name: kroma-web
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:18080/v1}
    ports:
      - "${WEB_PORT:-13000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:18080/v1}
      - API_URL=http://api:8080/v1
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - api

  api:
    container_name: kroma-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    ports:
      - "${API_PORT:-18080}:8080"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-http://localhost:18080/v1/auth/google/callback}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:13000}
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@database:5432/${POSTGRES_DB:-postgres}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-kroma}:${RABBITMQ_PASS:-kroma}@rabbitmq:5672
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_REGION=us-east-1
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-kromauser}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:-kromapassword}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-kroma-storage}
      - WORKER_IMAGE_URL=http://worker-image:8000
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      worker-image:
        condition: service_healthy

  worker-image:
    container_name: kroma-worker
    restart: unless-stopped
    build:
      context: ./apps/worker-image
      dockerfile: Dockerfile
    environment:
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-kroma}:${RABBITMQ_PASS:-kroma}@rabbitmq:5672
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_REGION=us-east-1
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-kromauser}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:-kromapassword}
      - STORAGE_BUCKET=${STORAGE_BUCKET:-kroma-storage}
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  database:
    image: postgres:17
    container_name: kroma-database
    restart: unless-stopped
    ports:
      - "${DB_BIND_IP:-127.0.0.1}:${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: kroma-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_MGMT_BIND_IP:-127.0.0.1}:${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-kroma}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-kroma}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio:
    image: pgsty/silo:latest
    container_name: kroma-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_BIND_IP:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_BIND_IP:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=${STORAGE_ACCESS_KEY:-kromauser}
      - MINIO_ROOT_PASSWORD=${STORAGE_SECRET_KEY:-kromapassword}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
