services:
  api:
    container_name: kroma-api
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    ports:
      - "18080:8080"
    env_file:
      - ./apps/api/.env
    environment:
      - NODE_ENV=production
      - GOOGLE_CALLBACK_URL=http://localhost:18080/v1/auth/google/callback
      - FRONTEND_URL=http://localhost:13000
      - DATABASE_URL=postgres://postgres:postgres@database:5432/postgres
      - RABBITMQ_URL=amqp://kroma:kroma@rabbitmq:5672
      - STORAGE_ENDPOINT=http://minio:9000
      - WORKER_IMAGE_URL=http://worker-image:8000
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      worker-image:
        condition: service_healthy
    networks:
      - saas-image

  worker-image:
    container_name: kroma-worker
    build:
      context: ./apps/worker-image
      dockerfile: Dockerfile
    ports:
      - "18000:8000"
    environment:
      - RABBITMQ_URL=amqp://kroma:kroma@rabbitmq:5672
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_ACCESS_KEY=kromauser
      - STORAGE_SECRET_KEY=kromapassword
      - STORAGE_BUCKET=kroma-storage
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - saas-image

  web:
    container_name: kroma-web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:18080/v1
    ports:
      - "13000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:18080/v1
      - API_URL=http://api:8080/v1
    depends_on:
      - api
    networks:
      - saas-image

  database:
    image: postgres:17
    container_name: kroma-database
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - .docker/postgres:/var/lib/postgresql/data
    networks:
      - saas-image

  rabbitmq:
    image: rabbitmq:3-management
    container_name: kroma-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=kroma # Porta do protocolo AMQP (aplicações)
      - RABBITMQ_DEFAULT_PASS=kroma # Painel web de gerenciamento
    volumes:
      - .docker/rabbitmq:/var/lib/rabbitmq
    networks:
      - saas-image
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: pgsty/silo:latest
    container_name: kroma-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Console Web
    environment:
      - MINIO_ROOT_USER=kromauser
      - MINIO_ROOT_PASSWORD=kromapassword
    volumes:
      - .docker/minio:/data
    networks:
      - saas-image
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  saas-image:
    driver: bridge
