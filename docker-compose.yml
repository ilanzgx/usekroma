services:
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    ports:
      - "18080:8080"
    env_file:
      - ./apps/api/.env
    environment:
      - NODE_ENV=production
      - GOOGLE_CALLBACK_URL=http://localhost:18080/v1/auth/google/callback
    depends_on:
      - database
      - worker-image
    networks:
      - saas-image

  worker-image:
    build:
      context: .
      dockerfile: ./apps/worker-image/Dockerfile
    ports:
      - "18000:8000"
    networks:
      - saas-image

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    ports:
      - "13000:3000"
    networks:
      - saas-image

  database:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - .docker/postgres:/var/lib/postgresql/data
    networks:
      - saas-image

networks:
  saas-image:
    driver: bridge
