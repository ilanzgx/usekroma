version: 2

updates:
  # Frontend - Next.js
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      frontend-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(web)"

  # Backend - Fastify
  - package-ecosystem: "npm"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      backend-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps(api)"

  # Worker Python - FastAPI
  - package-ecosystem: "pip"
    directory: "/apps/worker-image"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(worker)"
    ignore:
      - dependency-name: "torch"
      - dependency-name: "transformers"
      - dependency-name: "onnxruntime"
      - dependency-name: "tensorflow"
      - dependency-name: "diffusers"
      - dependency-name: "numpy"
      - dependency-name: "opencv-python"
      - dependency-name: "llvmlite"
      - dependency-name: "numba"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
