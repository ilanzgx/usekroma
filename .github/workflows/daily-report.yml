name: Daily Report

on:
  schedule:
    - cron: "59 2 * * *" # 23:59 BR
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate Daily Changes JSON
        run: |
          python .github/scripts/get_daily_changes.py > daily_changes.json

      - name: Generate Report
        run: |
          python .github/scripts/generate_report.py daily_changes.json > report.md
          cat report.md

      - name: Publish to Step Summary
        run: |
          echo "## 🤖 Daily Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat report.md >> $GITHUB_STEP_SUMMARY

      - name: Send to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          REPORT=$(cat report.md)

          if [ -z "$REPORT" ]; then
            REPORT="Nenhuma atualização de código registrada nas últimas 24 horas."
          fi

          if [ ${#REPORT} -gt 1900 ]; then
            REPORT="${REPORT:0:1900}..."
          fi

          curl --max-time 10 -f -X POST \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg content "$REPORT" '{content: $content}')" \
            "$DISCORD_WEBHOOK_URL"
